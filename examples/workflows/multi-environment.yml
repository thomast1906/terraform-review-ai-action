name: Multi-Environment Review

on:
  pull_request:
    paths:
      - 'terraform/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  review-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: hashicorp/setup-terraform@v3
      
      - name: Review Dev Environment
        run: |
          cd terraform/dev
          terraform init
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json
      
      - name: AI Review - Dev
        uses: thomast1906/terraform-review-ai-action@v2
        with:
          ai-provider: 'azure'
          azure-openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          azure-openai-endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          azure-openai-deployment: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          terraform-plan-path: 'terraform/dev/tfplan.json'
          terraform-directory: 'terraform/dev'
          analysis-preset: 'quick-check'
          analysis-depth: 'quick'
          analysis-mode: 'plan-only'

  review-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: hashicorp/setup-terraform@v3
      
      - name: Review Production Environment
        run: |
          cd terraform/prod
          terraform init
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json
      
      - name: AI Review - Production
        uses: thomast1906/terraform-review-ai-action@v2
        with:
          ai-provider: 'azure'
          azure-openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          azure-openai-endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          azure-openai-deployment: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          terraform-plan-path: 'terraform/prod/tfplan.json'
          terraform-directory: 'terraform/prod'
          analysis-preset: 'production-ready'
          analysis-depth: 'detailed'
          analysis-mode: 'comprehensive'
      
      - name: Block if Critical Issues
        run: |
          if [ -f analysis_summary.json ]; then
            HAS_ISSUES=$(jq -r '.has_critical_issues' analysis_summary.json)
            if [ "$HAS_ISSUES" = "true" ]; then
              echo "::error::Critical issues found in production deployment!"
              exit 1
            fi
          fi
