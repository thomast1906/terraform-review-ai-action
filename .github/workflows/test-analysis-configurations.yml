name: Test Analysis Configurations[All]

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'examples/terraform-plan-json/*.json'
      - '.github/workflows/test-analysis-configurations.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  # Analysis Preset Tests
  preset-security-audit:
    name: '🔒 Preset: Security Audit'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Run Security Audit Analysis
      uses: ./
      with:
        ai-provider: 'azure'
        azure-openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
        azure-openai-endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        azure-openai-deployment: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        terraform-plan-path: 'examples/terraform-plan-json/large_azure_plan.json'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        analysis-preset: 'security-audit'
        analysis-depth: 'detailed'
        analysis-style: 'severity'
        disable-pr-comment: 'true'
        skip-mcp-validation: 'false'

    - name: Upload Analysis
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: preset-security-audit-${{ github.run_id }}
        path: ai_analysis.md
        retention-days: 1

  preset-cost-optimisation:
    name: '💰 Preset: Cost Optimization'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Run Cost Optimization Analysis
