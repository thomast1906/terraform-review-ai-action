name: Multi-Cloud Infrastructure AI Review - Domain

on:
  push:
  pull_request:
    branches: [ main ]
    paths:
      - 'examples/terraform-plan-json/*.json'
      - '.github/workflows/test-multi-cloud-plans.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  azure-review:
    name: '☁️ Azure Plan Review'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Run Azure AI Review
      uses: ./
      with:
        ai-provider: 'azure'
        azure-openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
        azure-openai-endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        azure-openai-api-version: '2024-02-01'
        azure-openai-deployment: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        terraform-plan-path: 'examples/terraform-plan-json/large_azure_plan.json'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        disable-pr-comment: 'true'
        show-mcp-details: 'true'
        analysis-style: 'domain'

    - name: Upload Azure Analysis
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: azure-analysis-${{ github.run_id }}
        path: ai_analysis.md
        retention-days: 1

  aws-review:
    name: '☁️ AWS Plan Review'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Run AWS AI Review
      uses: ./
      with:
        ai-provider: 'azure'
        azure-openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
        azure-openai-endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        azure-openai-api-version: '2024-02-01'
        azure-openai-deployment: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        terraform-plan-path: 'examples/terraform-plan-json/large_aws_plan.json'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        disable-pr-comment: 'true'
        analysis-style: 'domain'

    - name: Upload AWS Analysis
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: aws-analysis-${{ github.run_id }}
        path: ai_analysis.md
        retention-days: 1

  gcp-review:
    name: '☁️ GCP Plan Review'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    
    - name: Run GCP AI Review
      uses: ./
      with:
        ai-provider: 'github-models'
        github-models-model: 'gpt-5'
        github-models-token: ${{ secrets.GITHUB_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        terraform-plan-path: 'examples/terraform-plan-json/large_gcp_plan.json'
        disable-pr-comment: 'true'
        skip-mcp-validation: 'false'
        show-mcp-details: 'true'
        analysis-style: 'domain'

    - name: Upload GCP Analysis
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gcp-analysis-${{ github.run_id }}
        path: ai_analysis.md
        retention-days: 1

  other-providers-review:
    name: '🔧 Other Providers Plan Review'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    
    - name: Run Other Providers AI Review
      uses: ./
      with:
        ai-provider: 'azure'
        azure-openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
        azure-openai-endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        azure-openai-api-version: '2024-02-01'
        azure-openai-deployment: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        terraform-plan-path: 'examples/terraform-plan-json/large_other_plan.json'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        disable-pr-comment: 'true'
        skip-mcp-validation: 'false'
        show-mcp-details: 'true'

    - name: Upload Other Providers Analysis
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: other-analysis-${{ github.run_id }}
        path: ai_analysis.md
        retention-days: 1

  combine-and-comment:
    name: '📝 Combine Analyses and Comment'
    needs: [azure-review, aws-review, gcp-review, other-providers-review]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Download All Analyses
      uses: actions/download-artifact@v5
      with:
        path: analyses

    - name: Create Combined PR Comment
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Read all analysis files
          const analyses = {
            azure: { icon: '☁️', title: 'Azure Infrastructure', content: '' },
            aws: { icon: '☁️', title: 'AWS Infrastructure', content: '' },
            gcp: { icon: '☁️', title: 'GCP Infrastructure', content: '' },
            other: { icon: '🔧', title: 'Other Providers Infrastructure', content: '' }
          };
          
          // Load analyses from artifacts
          try {
            analyses.azure.content = fs.readFileSync('analyses/azure-analysis-${{ github.run_id }}/ai_analysis.md', 'utf8');
          } catch (e) {
            analyses.azure.content = '⚠️ Analysis not available';
          }
          
          try {
            analyses.aws.content = fs.readFileSync('analyses/aws-analysis-${{ github.run_id }}/ai_analysis.md', 'utf8');
          } catch (e) {
            analyses.aws.content = '⚠️ Analysis not available';
          }
          
          try {
            analyses.gcp.content = fs.readFileSync('analyses/gcp-analysis-${{ github.run_id }}/ai_analysis.md', 'utf8');
          } catch (e) {
            analyses.gcp.content = '⚠️ Analysis not available';
          }
          
          try {
            analyses.other.content = fs.readFileSync('analyses/other-analysis-${{ github.run_id }}/ai_analysis.md', 'utf8');
          } catch (e) {
            analyses.other.content = '⚠️ Analysis not available';
          }
          
          // Build combined comment with dropdowns
          let commentBody = `# 🌐 Multi-Cloud Infrastructure Analysis (Domain Style)\n\n`;
          commentBody += `> **Analysis Date:** ${new Date().toUTCString()}\n`;
          commentBody += `> **Workflow Run:** [#${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n`;
          commentBody += `---\n\n`;
          
          // Add each cloud provider analysis in a dropdown
          for (const [key, data] of Object.entries(analyses)) {
            const maxLength = 45000; // Leave room for other content
            let content = data.content;
            
            if (content.length > maxLength) {
              content = content.substring(0, maxLength) + '\n\n... (content truncated due to length limits)';
            }
            
            commentBody += `<details>\n`;
            commentBody += `<summary><strong>${data.icon} ${data.title} Analysis</strong> - Click to expand</summary>\n\n`;
            commentBody += `${content}\n\n`;
            commentBody += `</details>\n\n`;
          }
          
          commentBody += `---\n\n`;
          commentBody += `*🤖 Powered by AI with Terraform MCP Server Integration | Domain-Focused Analysis*`;
          
          // Get PR number - handle both pull_request and push events
          let prNumber = context.payload.pull_request?.number;
          
          // If not a direct PR event, search for PR associated with this commit
          if (!prNumber && context.eventName === 'push') {
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });
            
            if (prs.data.length > 0) {
              prNumber = prs.data[0].number;
              console.log(`Found PR #${prNumber} associated with commit ${context.sha}`);
            }
          }
          
          if (!prNumber) {
            console.log('No PR number found, skipping comment');
            return;
          }
          
          // Find existing comment to update or create new one
          const comments = await github.rest.issues.listComments({
            issue_number: prNumber,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          
          const botComment = comments.data.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('🌐 Multi-Cloud Infrastructure Analysis (Domain Style)')
          );
          
          if (botComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: commentBody
            });
            console.log('Updated existing comment');
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
            console.log('Created new comment');
          }
