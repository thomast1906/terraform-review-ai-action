name: 'Terraform AI Plan Review'
description: 'Foundry-backed AI review of Terraform plans with optional Terraform Registry documentation enrichment'
author: 'Thomas Thornton'
branding:
  icon: shield
  color: purple

inputs:
  ai-provider:
    description: 'AI provider (only foundry-openai is supported)'
    required: false
    default: foundry-openai
  foundry-api-key:
    description: 'Microsoft Foundry API key'
    required: true
  foundry-endpoint:
    description: 'Microsoft Foundry endpoint URL'
    required: true
  foundry-deployment:
    description: 'Microsoft Foundry model deployment name'
    required: true
  terraform-plan-path:
    description: 'Path to Terraform show -json output'
    required: false
    default: tfplan.json
  terraform-directory:
    description: 'Directory containing Terraform source files'
    required: false
    default: .
  analysis-preset:
    description: 'Review preset: security-audit, cost-optimisation, production-ready, quick-check, or complete'
    required: false
    default: complete
  analysis-mode:
    description: 'Review plan only (default) or source and plan (comprehensive)'
    required: false
    default: plan-only
  analysis-depth:
    description: 'Review depth: quick, standard, or detailed'
    required: false
    default: detailed
  analysis-style:
    description: 'Report organisation: severity or domain'
    required: false
    default: severity
  disable-pr-comment:
    description: 'Do not create or update the managed pull request comment'
    required: false
    default: false
  github-token:
    description: 'GitHub token used for pull request comments; not required when comments are disabled'
    required: false
  fail-on-severity:
    description: 'Fail after review when findings reach none, warning, or critical'
    required: false
    default: none
  max-file-size-mb:
    description: 'Maximum source file size in MB'
    required: false
    default: '10'
  max-total-size-mb:
    description: 'Maximum total source size in MB'
    required: false
    default: '50'
  max-files:
    description: 'Maximum source files included'
    required: false
    default: '100'
  max-prompt-chars:
    description: 'Maximum serialized Foundry prompt characters; over-limit reviews fail without omitting resources'
    required: false
    default: '120000'
  target-prompt-chars:
    description: 'Prompt packing target in characters; must not exceed max-prompt-chars'
    required: false
    default: '100000'
  max-resources-per-request:
    description: 'Secondary cap on accepted Terraform resource changes per Foundry request'
    required: false
    default: '100'
  api-timeout-seconds:
    description: 'Foundry request timeout in seconds'
    required: false
    default: '120'
  api-max-retries:
    description: 'Maximum Foundry request attempts (default: two attempts, including one retry)'
    required: false
    default: '2'

outputs:
  analysis-result:
    description: 'Rich Markdown analysis'
    value: ${{ steps.analysis.outputs.analysis-result }}
  has-issues:
    description: 'Whether warning or critical findings were reported'
    value: ${{ steps.analysis.outputs.has-issues }}
  recommendations-count:
    description: 'Number of recommendation bullets'
    value: ${{ steps.analysis.outputs.recommendations-count }}
  highest-severity:
    description: 'Highest finding severity: none, warning, or critical'
    value: ${{ steps.analysis.outputs.highest-severity }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install dependencies
      shell: bash
      run: |
        venv_dir="$(mktemp -d "${RUNNER_TEMP:?}/terraform-ai-review.XXXXXX")"
        echo "TERRAFORM_AI_VENV=$venv_dir" >> "$GITHUB_ENV"
        python -m venv "$venv_dir"
        source "$venv_dir/bin/activate"
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r "${{ github.action_path }}/requirements/runtime.txt"

    - name: Start Terraform MCP Server
      id: mcp-server
      shell: bash
      run: |
        set +e
        echo 'mcp_available=false' >> "$GITHUB_OUTPUT"
        if ! command -v docker >/dev/null 2>&1; then
          echo 'Docker unavailable; continuing without documentation enrichment.'
          exit 0
        fi
        image='hashicorp/terraform-mcp-server@sha256:423a6b8e2ee06affcf090892f40c86469caba45fd2448ffa8ca5d717a174f7d5'
        if ! docker pull "$image" >/dev/null 2>&1; then
          echo 'MCP image unavailable; continuing without documentation enrichment.'
          exit 0
        fi
        if printf '%s\n' '{"jsonrpc":"2.0","id":"test","method":"initialize","params":{"protocolVersion":"2024-11-05","clientInfo":{"name":"terraform-ai-review","version":"1"}}}' | timeout 15 docker run --rm -i "$image" >/dev/null 2>&1; then
          echo 'mcp_available=true' >> "$GITHUB_OUTPUT"
        else
          echo 'MCP probe failed; continuing without documentation enrichment.'
        fi

    - name: Run AI Analysis
      id: analysis
      shell: bash
      env:
        AI_PROVIDER: ${{ inputs.ai-provider }}
        FOUNDRY_API_KEY: ${{ inputs.foundry-api-key }}
        FOUNDRY_ENDPOINT: ${{ inputs.foundry-endpoint }}
        FOUNDRY_DEPLOYMENT: ${{ inputs.foundry-deployment }}
        TERRAFORM_PLAN_PATH: ${{ inputs.terraform-plan-path }}
        TERRAFORM_DIRECTORY: ${{ inputs.terraform-directory }}
        ANALYSIS_PRESET: ${{ inputs.analysis-preset }}
        ANALYSIS_MODE: ${{ inputs.analysis-mode }}
        ANALYSIS_DEPTH: ${{ inputs.analysis-depth }}
        ANALYSIS_STYLE: ${{ inputs.analysis-style }}
        FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        MAX_FILE_SIZE_MB: ${{ inputs.max-file-size-mb }}
        MAX_TOTAL_SIZE_MB: ${{ inputs.max-total-size-mb }}
        MAX_FILES: ${{ inputs.max-files }}
        MAX_PROMPT_CHARS: ${{ inputs.max-prompt-chars }}
        TARGET_PROMPT_CHARS: ${{ inputs.target-prompt-chars }}
        MAX_RESOURCES_PER_REQUEST: ${{ inputs.max-resources-per-request }}
        API_TIMEOUT_SECONDS: ${{ inputs.api-timeout-seconds }}
        API_MAX_RETRIES: ${{ inputs.api-max-retries }}
        MCP_AVAILABLE: ${{ steps.mcp-server.outputs.mcp_available }}
      run: |
        source "$TERRAFORM_AI_VENV/bin/activate"
        python "${{ github.action_path }}/analyse_terraform.py"
        if [ -f analysis_summary.json ]; then
          python - <<'PY'
        import json
        import os
        summary = json.load(open('analysis_summary.json', encoding='utf-8'))
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            output.write(f"has-issues={str(summary['has_issues']).lower()}\n")
            output.write(f"recommendations-count={summary['recommendations_count']}\n")
            output.write(f"highest-severity={summary['highest_severity']}\n")
        PY
        fi
        if [ -f ai_analysis.md ]; then
          python - <<'PY'
        import os
        import secrets
        analysis = open('ai_analysis.md', encoding='utf-8').read()
        delimiter = f"terraform_review_{secrets.token_hex(16)}"
        while delimiter in analysis:
            delimiter = f"terraform_review_{secrets.token_hex(16)}"
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            output.write(f"analysis-result<<{delimiter}\n{analysis}\n{delimiter}\n")
        PY
        fi

    - name: Comment on PR
      if: github.event_name == 'pull_request' && inputs.disable-pr-comment != 'true' && inputs.github-token != ''
      uses: actions/github-script@v8
      env:
        REVIEW_SCRIPT: ${{ github.action_path }}/scripts/comment.js
        REVIEW_BODY: ${{ steps.analysis.outputs.analysis-result }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { upsertReviewComment } = require(process.env.REVIEW_SCRIPT);
          await upsertReviewComment({ github, context, body: process.env.REVIEW_BODY });

    - name: Enforce severity policy
      if: always()
      shell: bash
      run: |
        if [ -f analysis_summary.json ]; then
          python - <<'PY'
        import json, sys
        summary = json.load(open('analysis_summary.json'))
        if summary.get('severity_gate_triggered'):
            print('Severity policy blocked this review.')
            sys.exit(1)
        PY
        fi

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        case "${TERRAFORM_AI_VENV:-}" in
          "${RUNNER_TEMP:?}"/terraform-ai-review.*) rm -rf "$TERRAFORM_AI_VENV" ;;
          *) echo 'No action-owned virtual environment to remove.' ;;
        esac
